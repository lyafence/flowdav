name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
          - os: macOS-amd64
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macOS-arm64
            arch: arm64
            goos: darwin
            goarch: arm64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: linux
            arch: mipsle
            goos: linux
            goarch: mipsle
            gomips: softfloat

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Build Binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          FOLDER="flowdav-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$FOLDER"
          SUFFIX=""
          [ "${{ matrix.goos }}" == "windows" ] && SUFFIX=".exe"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" GOMIPS="${{ matrix.gomips }}" \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "$FOLDER/flowdav$SUFFIX" ./cmd/flowdav
          cp LICENSE "$FOLDER/" 2>/dev/null || true
          cp configs/*.json.example "$FOLDER/" 2>/dev/null || true
          cp README.md "$FOLDER/"
          tar -czf "${FOLDER}.tar.gz" "$FOLDER"
          cp "${FOLDER}.tar.gz" "flowdav-latest-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: flowdav-*.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify pinned NDK and install gomobile
        run: |
          expected="$(make -s ndk-version)"
          actual="$(basename "$ANDROID_NDK_HOME")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::runner NDK $actual != pinned $expected (Makefile ANDROID_NDK_VERSION)"
            exit 1
          fi
          ln -sf "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk-bundle"
          go install golang.org/x/mobile/cmd/gomobile
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build AAR (gomobile)
        env:
          VERSION_REF: ${{ github.ref_name }}
        run: |
          gomobile init
          ANDROID_SDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" make android-aar VERSION="$VERSION_REF"

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Rename APK
        env:
          TAG: ${{ github.ref_name }}
        run: mv app-release.apk "flowdav-android-$TAG.apk"
        working-directory: android/app/build/outputs/apk/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/flowdav-android-${{ github.ref_name }}.apk

  release:
    name: Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.apk" -exec cp {} release-assets/ \;

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --generate-notes

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
