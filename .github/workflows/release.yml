name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
          - os: macOS-amd64
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macOS-arm64
            arch: arm64
            goos: darwin
            goarch: arm64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: linux
            arch: mipsle
            goos: linux
            goarch: mipsle
            gomips: softfloat

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Build Binary
        run: |
          VERSION=${GITHUB_REF_NAME}
          FOLDER="flowdav-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p $FOLDER
          SUFFIX=""
          [ "${{ matrix.goos }}" == "windows" ] && SUFFIX=".exe"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOMIPS=${{ matrix.gomips }} \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o $FOLDER/flowdav$SUFFIX ./cmd/flowdav
          cp LICENSE $FOLDER/ 2>/dev/null || true
          cp configs/*.json.example $FOLDER/ 2>/dev/null || true
          cp README.md $FOLDER/
          tar -czf "${FOLDER}.tar.gz" $FOLDER
          cp "${FOLDER}.tar.gz" "flowdav-latest-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: flowdav-*.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Link NDK for gomobile
        run: ln -sf $ANDROID_NDK_HOME $ANDROID_HOME/ndk-bundle

      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 26 \
            -javapkg com.flowdav.app \
            -o android/app/libs/flowdav.aar \
            -trimpath -ldflags="-s -w -X github.com/lyafence/flowdav/cmd/android.version=${GITHUB_REF_NAME}" \
            ./cmd/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Rename APK
        run: mv app-release.apk flowdav-android-${{ github.ref_name }}.apk
        working-directory: android/app/build/outputs/apk/release

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/flowdav-android-${{ github.ref_name }}.apk

  release:
    name: Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.apk" -exec cp {} release-assets/ \;

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: false

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
