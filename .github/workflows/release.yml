name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
          - os: macOS-amd64
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: macOS-arm64
            arch: arm64
            goos: darwin
            goarch: arm64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: linux
            arch: mipsle
            goos: linux
            goarch: mipsle
            gomips: softfloat

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"

      - name: Build Binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          FOLDER_NAME="flowdav-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p $FOLDER_NAME

          SUFFIX=""
          if [ "${{ matrix.goos }}" == "windows" ]; then
            SUFFIX=".exe"
          fi

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOMIPS=${{ matrix.gomips }} go build \
            -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o $FOLDER_NAME/flowdav$SUFFIX ./cmd/flowdav

          cp configs/*.json.example $FOLDER_NAME/ 2>/dev/null || true
          cp README.md $FOLDER_NAME/

          tar -czf "${FOLDER_NAME}.tar.gz" $FOLDER_NAME

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
           files: flowdav-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Link NDK for gomobile
        run: ln -sf $ANDROID_NDK_HOME $ANDROID_HOME/ndk-bundle

      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 26 \
            -javapkg com.flowdav.app \
            -o android/app/libs/flowdav.aar \
            -trimpath -ldflags="-s -w" \
            ./cmd/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Attach APK to release
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/*.apk
