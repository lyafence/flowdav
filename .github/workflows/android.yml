name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'cmd/android/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'cmd/android/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify pinned NDK and install gomobile
        run: |
          expected="$(make -s ndk-version)"
          actual="$(basename "$ANDROID_NDK_HOME")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::runner NDK $actual != pinned $expected (Makefile ANDROID_NDK_VERSION)"
            exit 1
          fi
          ln -sf "$ANDROID_NDK_HOME" "$ANDROID_HOME/ndk-bundle"
          go install golang.org/x/mobile/cmd/gomobile
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build AAR (gomobile)
        run: |
          gomobile init
          ANDROID_SDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" make android-aar

      - name: Cache ktlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flowdav
          key: ${{ runner.os }}-ktlint

      - name: Kotlin lint (ktlint)
        run: make lint-kotlin

      - name: Build and verify
        working-directory: android
        run: >-
          ./gradlew
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
