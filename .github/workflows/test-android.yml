name: Test Android CI
on:
  push:
    branches:
      - feat/android
    paths:
      - 'android/**'
      - 'cmd/android/**'
      - 'Makefile'
      - '.github/workflows/test-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Link NDK for gomobile
        run: ln -sf $ANDROID_NDK_HOME $ANDROID_HOME/ndk-bundle

      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Verify signing key
        run: keytool -list -keystore keystore.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Build AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 26 \
            -javapkg com.flowdav.app \
            -o android/app/libs/flowdav.aar \
            -trimpath -ldflags="-s -w" \
            ./cmd/android

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_APP_VERSION: 0.0.0-test
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Rename APK
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          NAME="${{ github.event.repository.name }}-android-${SHA}.apk"
          mv "$APK" "$NAME"
          echo "path=$NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.path }}
          archive: false
