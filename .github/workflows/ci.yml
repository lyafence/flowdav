name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.githooks/**'
      - 'configs/*.json.example'
      - 'android/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'scripts/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Build
        run: go build ./...

      - name: Module check
        run: |
          go mod tidy -e
          test -z "$(git diff go.mod go.sum)"

      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

      - name: Fuzz
        run: |
          go test -fuzztime=10s -fuzz FuzzEnvelopeUnmarshalBinary ./internal/transport/
          go test -fuzztime=10s -fuzz FuzzEnvelopeDecode ./internal/transport/
          go test -fuzztime=10s -fuzz FuzzDecodeEnvelopeWithCryptoNoCrypto ./internal/transport/

      - name: Vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
