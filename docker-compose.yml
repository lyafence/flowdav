services:
  webdav-multi-1:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-multi-1
    mem_limit: 64m
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  webdav-multi-2:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-multi-2
    mem_limit: 64m
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8082:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  webdav-multi-3:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-multi-3
    mem_limit: 64m
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8083:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  # Dedicated WebDAV for single-backend tests (isolated from multi-backend
  # to prevent cross-contamination — different encryption keys would cause
  # HMAC failures and file deletion on the other pair).
  webdav-single:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-single
    mem_limit: 64m
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  flow-server:
    image: localhost/flowdav:latest
    container_name: flow-server
    stop_grace_period: 10s
    mem_limit: 64m
    depends_on:
      webdav-single:
        condition: service_healthy
    volumes:
      - ./configs/flowdav_test.json:/app/configs/flowdav_test.json:Z
    command: flowdav -s /app/configs/flowdav_test.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9190/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  flow-client:
    image: localhost/flowdav:latest
    container_name: flow-client
    stop_grace_period: 10s
    mem_limit: 64m
    depends_on:
      webdav-single:
        condition: service_healthy
      flow-server:
        condition: service_healthy
    volumes:
      - ./configs/flowdav_test.json:/app/configs/flowdav_test.json:Z
    command: flowdav -c /app/configs/flowdav_test.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "11080:11080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9190/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  # Multi-backend WebDAV tests
  flow-server-multi:
    image: localhost/flowdav:latest
    container_name: flow-server-multi
    stop_grace_period: 10s
    mem_limit: 64m
    depends_on:
      webdav-multi-1:
        condition: service_healthy
      webdav-multi-2:
        condition: service_healthy
      webdav-multi-3:
        condition: service_healthy
    volumes:
      - ./configs/flowdav_test_multi.json:/app/configs/flowdav_test_multi.json:Z
    command: flowdav -s /app/configs/flowdav_test_multi.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9190/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  flow-client-multi:
    image: localhost/flowdav:latest
    container_name: flow-client-multi
    stop_grace_period: 10s
    mem_limit: 64m
    depends_on:
      webdav-multi-1:
        condition: service_healthy
      webdav-multi-2:
        condition: service_healthy
      webdav-multi-3:
        condition: service_healthy
      flow-server-multi:
        condition: service_healthy
    volumes:
      - ./configs/flowdav_test_multi.json:/app/configs/flowdav_test_multi.json:Z
    command: flowdav -c /app/configs/flowdav_test_multi.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "11081:11080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9190/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

networks:
  flow-net:
    driver: bridge
