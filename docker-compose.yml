services:
  webdav:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-test
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  webdav2:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-test-2
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  webdav3:
    image: docker.io/rclone/rclone:latest
    container_name: webdav-test-3
    command: serve webdav /data --addr 0.0.0.0:8080 --user test --pass test
    ports:
      - "8082:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://test:test@localhost:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flow-net

  flow-server:
    image: localhost/flowdav:latest
    container_name: flow-server
    stop_grace_period: 10s
    depends_on:
      webdav:
        condition: service_started
    volumes:
      - ./configs/flowdav_test_server.json:/app/configs/flowdav_test_server.json:Z
    command: flowdav-server -c /app/configs/flowdav_test_server.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  flow-client:
    image: localhost/flowdav:latest
    container_name: flow-client
    stop_grace_period: 10s
    depends_on:
      webdav:
        condition: service_started
      flow-server:
        condition: service_started
    volumes:
      - ./configs/flowdav_test_client.json:/app/configs/flowdav_test_client.json:Z
    command: flowdav-client -c /app/configs/flowdav_test_client.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "11080:11080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  # Multi-backend WebDAV tests
  flow-server-multi:
    image: localhost/flowdav:latest
    container_name: flow-server-multi
    stop_grace_period: 10s
    depends_on:
      webdav:
        condition: service_started
      webdav2:
        condition: service_started
      webdav3:
        condition: service_started
    volumes:
      - ./configs/flowdav_test_server_multi.json:/app/configs/flowdav_test_server_multi.json:Z
    command: flowdav-server -c /app/configs/flowdav_test_server_multi.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

  flow-client-multi:
    image: localhost/flowdav:latest
    container_name: flow-client-multi
    stop_grace_period: 10s
    depends_on:
      webdav:
        condition: service_started
      webdav2:
        condition: service_started
      webdav3:
        condition: service_started
      flow-server-multi:
        condition: service_started
    volumes:
      - ./configs/flowdav_test_client_multi.json:/app/configs/flowdav_test_client_multi.json:Z
    command: flowdav-client -c /app/configs/flowdav_test_client_multi.json
    environment:
      - FLOWDAV_PASSWORD=${FLOWDAV_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "11081:11080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flow-net

networks:
  flow-net:
    driver: bridge
